<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مين فينا؟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
/* Layout: one-screen app. Phone = game/chat tabs; wide = game and chat side by side. */
:root{
  --bg:#EEEDF6; --surface:#FFFFFF; --ink:#1E1B3B; --muted:#6B6890; --line:#DAD7EC;
  --coral:#F2553F; --coral-ink:#FFFFFF; --sun:#FFC53D; --mint:#1FA97C; --soft:#F6F5FC;
  --display:"Lalezar","Cairo",system-ui,sans-serif; --body:"Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16142B; --surface:#211E3E; --ink:#F1EFFF; --muted:#A19DCB; --line:#35315F;
  --coral:#FF6B55; --coral-ink:#1E1B3B; --sun:#FFCF5C; --mint:#34C796; --soft:#1B1935; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16142B; --surface:#211E3E; --ink:#F1EFFF; --muted:#A19DCB; --line:#35315F;
  --coral:#FF6B55; --coral-ink:#1E1B3B; --sun:#FFCF5C; --mint:#34C796; --soft:#1B1935; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;padding-inline:0}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}

/* join screen */
#join{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:24px 16px;max-width:460px;margin:0 auto}
#join h1{font-size:3.4rem;line-height:1.05}
#join h1 span{color:var(--coral)}
#join p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.9rem}
.field input{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.field input:focus{border-color:var(--coral);outline:none}
.hint{font-size:.82rem;color:var(--muted)}
.btn{background:var(--coral);color:var(--coral-ink);border:0;border-radius:14px;padding:12px 20px;font-weight:700;font-size:1.05rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.err{background:var(--soft);border:2px dashed var(--coral);border-radius:14px;padding:14px;color:var(--ink)}

/* app shell */
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:2px solid var(--line);background:var(--surface)}
.top h2{font-size:1.7rem;color:var(--coral);line-height:1}
.code{font-size:.8rem;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.stack{display:flex;-webkit-flex-direction:row;gap:0;align-items:center}
.stack .av{margin-inline-start:-8px;border:2px solid var(--surface)}
.main{flex:1;min-height:0;display:flex}
.panel{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.panel.off{display:none}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;border-top:2px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;border:0;padding:12px;font-weight:700;color:var(--muted);position:relative}
.tabs button[aria-selected="true"]{color:var(--coral);box-shadow:inset 0 3px 0 var(--coral)}
.dot{position:absolute;top:8px;inset-inline-end:28%;background:var(--coral);color:var(--coral-ink);border-radius:99px;font-size:.7rem;min-width:18px;padding:0 5px;line-height:18px}
@media (min-width:860px){
  .tabs{display:none}
  .panel.off{display:flex}
  .main{max-width:1060px;width:100%;margin:0 auto;gap:0}
  .panel.chat{max-width:380px;border-inline-start:2px solid var(--line)}
}

/* avatars */
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.15rem;color:#1E1B3B;flex:none}
.av.lg{width:48px;height:48px;font-size:1.5rem}

/* cards */
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px}
.q{background:var(--coral);color:var(--coral-ink);border:0;padding:22px 18px}
.q small{display:block;font-weight:700;letter-spacing:.04em;opacity:.85;margin-bottom:6px}
.q h3{font-size:1.9rem;line-height:1.25}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pick{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:start;min-width:0}
.pick span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pick[aria-pressed="true"]{border-color:var(--coral);background:var(--soft);box-shadow:0 0 0 2px var(--coral) inset}
.status{color:var(--muted);font-size:.92rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.bar .track{background:var(--soft);border-radius:99px;height:14px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--mint);border-radius:99px;transition:width .5s ease}
.bar.win .fill{background:var(--sun)}
.bar .num{font-weight:700;min-width:1.5ch;text-align:end;font-variant-numeric:tabular-nums}
.badge{background:var(--sun);color:#1E1B3B;font-weight:700;font-size:.75rem;border-radius:99px;padding:1px 8px}
.who{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9em}
.board{display:flex;flex-direction:column;gap:8px}
.board .line{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cups{font-variant-numeric:tabular-nums;font-weight:700}
.winnerline{font-family:var(--display);font-size:1.5rem}

/* chat */
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;display:flex;flex-direction:column;gap:2px}
.msg .meta{font-size:.74rem;color:var(--muted)}
.msg .bub{background:var(--surface);border:2px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;overflow-wrap:anywhere}
.msg.me{align-self:flex-start}
.msg.me .bub{background:var(--coral);color:var(--coral-ink);border-color:var(--coral);border-radius:16px 16px 4px 16px}
.msg:not(.me){align-self:flex-end}
.empty{color:var(--muted);text-align:center;margin:auto;padding:20px}
.compose{display:flex;gap:8px;padding:10px 16px;border-top:2px solid var(--line);background:var(--surface)}
.compose input{flex:1;min-width:0;background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.compose input:focus{border-color:var(--coral);outline:none}
.compose .btn{padding:10px 16px}
@media (prefers-reduced-motion:reduce){.bar .fill{transition:none}}
</style>
</head>
<body>
<script>
/* Standalone fallback (GitHub Pages): same-device rooms over BroadcastChannel. Skipped inside Claude. */
(function(){
  if (window.claude && window.claude.use) return;
  var tabId = Math.random().toString(36).slice(2);
  window.__standalone = true;
  window.claude = { use: async function(name){
    if (name !== "room") return null;
    return { join: async function(code){
      var ch = new BroadcastChannel("lamma-"+code), known = {}, mine = {}, hs = [];
      function emit(){ var peers = Object.keys(known).map(function(k){ return {peer:k,presence:known[k].p,updatedAt:known[k].t,isMe:k===tabId}; });
        hs.forEach(function(h){ h({peers:peers,joined:[],left:[],updated:[]}); }); }
      function send(){ ch.postMessage({k:"p",id:tabId,p:mine,t:Date.now()}); }
      ch.onmessage = function(e){ var m = e.data;
        if (m.k==="p"){ known[m.id]={p:m.p,t:m.t}; emit(); }
        else if (m.k==="hi"){ send(); }
        else if (m.k==="bye"){ delete known[m.id]; emit(); } };
      window.addEventListener("pagehide", function(){ ch.postMessage({k:"bye",id:tabId}); });
      return {
        presence: async function(patch){ Object.assign(mine,patch); known[tabId]={p:mine,t:Date.now()}; send(); emit(); },
        onPeers: function(h){ hs.push(h); ch.postMessage({k:"hi"}); setTimeout(emit,20); return function(){} }
      };
    }};
  }};
})();
</script>
<script>
  if (window.__standalone) document.addEventListener("DOMContentLoaded", function(){
    var n = document.createElement("div"); n.className = "err";
    n.innerHTML = "ده عرض تجريبي على نفس الجهاز بس. عشان تلعبوا من تليفونات مختلفة مع الشات، افتح <a href=\"https://claude.ai/artifact/W2uVqrAqJPAsWCj8GaQA4W\">نسخة Claude</a>.";
    document.getElementById("join").appendChild(n);
  });
</script>


<div id="join" hidden>
  <h1>مين <span>فينا؟</span></h1>
  <p>لعبة العيلة: كل واحد من تليفونه يصوّت على الباقيين، والنتيجة بتطلع قدام الكل. فيها شات تتكلموا فيه وانتم بتلعبوا.</p>
  <div class="field">
    <label for="name">اسمك</label>
    <input id="name" maxlength="14" autocomplete="off" placeholder="مثلاً: يوسف">
  </div>
  <div class="field">
    <label for="code">كود الغرفة</label>
    <input id="code" dir="ltr" maxlength="24" autocomplete="off" value="family" spellcheck="false">
    <span class="hint">كل اللي هيلعبوا معاك يكتبوا نفس الكود (حروف إنجليزي وأرقام).</span>
  </div>
  <button class="btn" id="go" type="button">ادخل اللعبة</button>
  <div id="joinerr" class="err" hidden></div>
</div>

<div id="app" hidden>
  <div class="top">
    <div><h2>مين فينا؟</h2><div class="code" id="roomcode"></div></div>
    <div class="stack" id="stack" aria-label="اللاعبين"></div>
  </div>
  <div class="main">
    <section class="panel game" id="pgame"><div class="scroll" id="game"></div></section>
    <section class="panel chat off" id="pchat" aria-label="الشات">
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <form class="compose" id="form">
        <input id="msg" maxlength="100" autocomplete="off" placeholder="اكتب رسالة...">
        <button class="btn" type="submit">ابعت</button>
      </form>
    </section>
  </div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tgame" aria-selected="true">اللعبة</button>
    <button type="button" role="tab" id="tchat" aria-selected="false">الشات<span class="dot" id="unread" hidden>0</span></button>
  </div>
</div>

<script>
(function () {
  document.documentElement.setAttribute('dir','rtl'); document.documentElement.setAttribute('lang','ar');
  var $ = function (s) { return document.querySelector(s); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); };

  var QUESTIONS = [
    "مين فينا أكتر واحد بيتأخر على أي معاد؟", "مين فينا أكتر واحد هيبقى مليونير؟", "مين فينا أكتر واحد بيحب ينام؟",
    "مين فينا أكتر واحد بيبوّظ أي سر؟", "مين فينا أكتر واحد هيتوه وهو ماشي بالخريطة؟", "مين فينا أحسن واحد في الطبخ؟",
    "مين فينا أكتر واحد بيرغي في التليفون؟", "مين فينا أكتر واحد هيعيط في فيلم؟", "مين فينا أكتر واحد بياكل من طبق غيره؟",
    "مين فينا أكتر واحد هيبقى مشهور؟", "مين فينا أكتر واحد بينسى حط موبايله فين؟", "مين فينا أكتر واحد عنيد؟",
    "مين فينا أكتر واحد بيضحّك الكل؟", "مين فينا أكتر واحد بيصحى بدري؟", "مين فينا أكتر واحد هيكسب في مسابقة أكل؟",
    "مين فينا أكتر واحد بيحب السيلفي؟", "مين فينا أكتر واحد بيغيّر رأيه في آخر لحظة؟", "مين فينا أكتر واحد هيعيش لحد ١٠٠ سنة؟",
    "مين فينا أكتر واحد بيصرف من غير تفكير؟", "مين فينا أكتر واحد بيحب الأكل الحراق؟", "مين فينا أكتر واحد بيسيب الأنوار مفتوحة؟",
    "مين فينا أكتر واحد هيبقى رئيس شركة؟", "مين فينا أكتر واحد بيقول «ثواني وجاي» وبيتأخر ساعة؟", "مين فينا أكتر واحد بيسمع الأغاني بصوت عالي؟",
    "مين فينا أكتر واحد هيخاف من صرصار؟", "مين فينا أكتر واحد حافظ نكت؟", "مين فينا أكتر واحد بيتخانق على ريموت التليفزيون؟",
    "مين فينا أكتر واحد بيحب يدي نصايح؟", "مين فينا أكتر واحد بيشرب شاي؟", "مين فينا أكتر واحد بيسهر لآخر الليل؟",
    "مين فينا أكتر واحد قلبه طيب؟", "مين فينا أكتر واحد بيقلّد الناس؟", "مين فينا أكتر واحد بيحب الهدايا؟",
    "مين فينا أكتر واحد بيعمل مقالب في الباقيين؟", "مين فينا أكتر واحد بيحب يرتّب البيت؟", "مين فينا أكتر واحد هيبقى دكتور شاطر؟"
  ];
  var COLORS = ["#FF8A7A", "#FFC53D", "#7BD3B0", "#8FB8FF", "#C9A6FF", "#FF9EC7", "#9ADB7A", "#FFB86B"];

  var uid = null;
  try { uid = sessionStorage.getItem("uid"); } catch (e) {}
  if (!uid) { uid = Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem("uid", uid); } catch (e) {} }
  var hash = function (s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  var colorOf = function (u) { return COLORS[hash(u) % COLORS.length]; };
  var initial = function (n) { return esc((n || "؟").trim().charAt(0) || "؟"); };
  var av = function (u, n, big) { return '<span class="av' + (big ? " lg" : "") + '" style="background:' + colorOf(u) + '">' + initial(n) + "</span>"; };

  function shuffled(seed) {
    var a = QUESTIONS.slice(), s = hash(seed) || 1;
    for (var i = a.length - 1; i > 0; i--) {
      s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
      var j = s % (i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  var showJoin = function () { $("#join").hidden = false; };
  $("#name").value = store.get("name") || "";
  var savedCode = store.get("code"); if (savedCode) $("#code").value = savedCode;
  showJoin();

  $("#go").addEventListener("click", function () {
    var name = $("#name").value.trim().slice(0, 14);
    var code = $("#code").value.toLowerCase().replace(/[^a-z0-9_.-]/g, "").replace(/^[^a-z0-9]+/, "").slice(0, 24) || "family";
    var err = $("#joinerr");
    if (!name) { err.hidden = false; err.textContent = "اكتب اسمك الأول."; return; }
    err.hidden = true;
    store.set("name", name); store.set("code", code);
    $("#go").disabled = true;
    start(name, code).catch(function () {
      $("#go").disabled = false;
      err.hidden = false;
      err.textContent = "مقدرتش أوصّل اللعبة. افتح الرابط من التطبيق أو من الرابط اللي اتبعتلك وجرّب تاني.";
    });
  });

  async function start(name, code) {
    var cap = window.claude && window.claude.use ? await window.claude.use("room") : null;
    if (!cap) throw new Error("no room");
    var room;
    try { room = await cap.join(code); } catch (e) { room = cap; }

    $("#join").hidden = true; $("#app").hidden = false;
    $("#roomcode").textContent = "الغرفة: " + code;

    var order = shuffled(code);
    var wins = Number(store.get("w:" + code + uid) || 0), counted = Number(store.get("c:" + code + uid) || 0);
    var mine = { u: uid, n: name, r: 0, w: wins };
    var peers = [], chat = new Map(), myChat = [], tab = "game", unread = 0, queued = false;

    function setP(patch) { Object.assign(mine, patch); room.presence(patch).catch(function () {}); queue(); }
    function queue() { if (queued) return; queued = true; setTimeout(function () { queued = false; render(); }, 16); }
    setP({});
    room.presence({ u: uid, n: name, r: 0, w: wins }).catch(function () {});

    function players() {
      var m = new Map();
      peers.forEach(function (p) {
        var x = p.presence; if (!x || !x.u || !x.n) return;
        var o = m.get(x.u); if (!o || p.updatedAt > o.updatedAt) m.set(x.u, p);
      });
      if (!m.has(uid)) m.set(uid, { presence: {}, updatedAt: 0 });
      return Array.from(m.entries()).map(function (e) {
        var x = Object.assign({}, e[1].presence, e[0] === uid ? mine : {});
        return { u: e[0], n: String(x.n || "؟"), r: x.r | 0, vt: x.vt, rv: x.rv | 0, w: x.w | 0, me: e[0] === uid };
      });
    }
    function state() {
      var pl = players(), R = 0;
      pl.forEach(function (p) { if (p.r > R) R = p.r; });
      var voted = pl.filter(function (p) { return R > 0 && p.vt && p.vt[0] === R; });
      var revealed = R > 0 && (pl.some(function (p) { return p.rv === R; }) || (pl.length >= 2 && voted.length === pl.length));
      var tally = {}; pl.forEach(function (p) { tally[p.u] = 0; });
      voted.forEach(function (p) { if (tally[p.vt[1]] !== undefined) tally[p.vt[1]]++; });
      var max = 0; Object.keys(tally).forEach(function (k) { if (tally[k] > max) max = tally[k]; });
      return { pl: pl, R: R, voted: voted, revealed: revealed, tally: tally, max: max };
    }
    function sync() {
      var s = state();
      if ((mine.r | 0) < s.R) setP({ r: s.R });
      if (s.revealed) {
        if (mine.rv !== s.R) setP({ rv: s.R });
        if (counted < s.R) {
          counted = s.R; store.set("c:" + code + uid, String(counted));
          if (s.max > 0 && s.tally[uid] === s.max) { wins++; store.set("w:" + code + uid, String(wins)); setP({ w: wins }); }
        }
      }
    }

    function collectChat(list) {
      var fresh = 0;
      list.forEach(function (p) {
        var x = p.presence; if (!x || !Array.isArray(x.c)) return;
        x.c.forEach(function (m) {
          if (!m || !m.i || chat.has(m.i)) return;
          chat.set(m.i, { i: m.i, n: String(m.n || x.n || "؟"), t: String(m.t || ""), s: Number(m.s) || 0, u: x.u, me: x.u === uid });
          if (x.u !== uid) fresh++;
        });
      });
      if (fresh && tab !== "chat") unread += fresh;
      if (fresh) renderChat();
    }

    room.onPeers(function (ch) {
      peers = ch.peers.slice();
      collectChat(peers);
      sync(); queue();
    });

    /* ---------- render ---------- */
    function renderTop(pl) {
      $("#stack").innerHTML = pl.slice(0, 6).map(function (p) { return av(p.u, p.n); }).join("") +
        (pl.length > 6 ? '<span class="badge" style="margin-inline-start:6px">+' + (pl.length - 6) + "</span>" : "");
    }
    function board(pl) {
      var rows = pl.slice().sort(function (a, b) { return b.w - a.w || a.n.localeCompare(b.n); });
      return '<div class="card"><h3 style="font-size:1.3rem;margin-bottom:10px">الكاسات</h3><div class="board">' +
        rows.map(function (p) {
          return '<div class="line"><div class="who">' + av(p.u, p.n) + "<b>" + esc(p.n) + (p.me ? " (أنا)" : "") + '</b></div><span class="cups">' + p.w + "</span></div>";
        }).join("") + "</div></div>";
    }
    function render() {
      var s = state(), pl = s.pl, el = $("#game"), keep = el.scrollTop;
      renderTop(pl);
      var h = "";
      if (s.R === 0) {
        h += '<div class="card"><h3 style="font-size:1.8rem">مستنيين العيلة</h3>' +
          '<p style="color:var(--muted);margin:6px 0 14px">ابعت الرابط وكود الغرفة <b dir="ltr" style="unicode-bidi:isolate">' + esc(code) + "</b> للباقيين. لما يدخلوا، أي واحد يدوس ابدأ.</p>" +
          '<div class="grid">' + pl.map(function (p) { return '<div class="pick" style="border-style:dashed">' + av(p.u, p.n) + '<span class="n">' + esc(p.n) + (p.me ? " (أنا)" : "") + "</span></div>"; }).join("") + "</div></div>" +
          '<button class="btn" id="start" type="button"' + (pl.length < 2 ? " disabled" : "") + ">ابدأ اللعبة</button>" +
          (pl.length < 2 ? '<p class="hint" style="margin:0">محتاجين لاعبين اتنين على الأقل.</p>' : "");
      } else {
        var q = order[(s.R - 1) % order.length];
        var myVote = mine.vt && mine.vt[0] === s.R ? mine.vt[1] : null;
        h += '<div class="card q"><small>سؤال ' + s.R + "</small><h3>" + esc(q) + "</h3></div>";
        if (!s.revealed) {
          h += '<div class="grid">' + pl.map(function (p) {
            return '<button type="button" class="pick" data-vote="' + esc(p.u) + '" aria-pressed="' + (myVote === p.u) + '">' + av(p.u, p.n) +
              '<span class="n">' + esc(p.n) + (p.me ? " (أنا)" : "") + "</span></button>";
          }).join("") + "</div>" +
            '<div class="status"><span>اتصوّت ' + s.voted.length + " من " + pl.length + "</span>" +
            '<button type="button" class="btn" id="reveal"' + (myVote ? "" : " disabled") + ">اكشف النتيجة</button></div>";
        } else {
          var rows = pl.slice().sort(function (a, b) { return s.tally[b.u] - s.tally[a.u]; });
          var winners = s.max > 0 ? rows.filter(function (p) { return s.tally[p.u] === s.max; }) : [];
          h += '<div class="card"><div class="winnerline">' + (winners.length ? "الفايز: " + winners.map(function (p) { return esc(p.n); }).join(" و ") : "محدش اتصوّت له") + "</div>" +
            '<div class="board" style="margin-top:12px">' + rows.map(function (p) {
              var pct = s.max ? Math.round(s.tally[p.u] / s.max * 100) : 0;
              return '<div class="bar' + (s.tally[p.u] === s.max && s.max > 0 ? " win" : "") + '"><div class="who">' + av(p.u, p.n) + "<b>" + esc(p.n) + "</b></div>" +
                '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div><span class="num">' + s.tally[p.u] + "</span></div>";
            }).join("") + "</div></div>" +
            '<button class="btn" id="next" type="button">السؤال الجاي</button>';
        }
      }
      h += board(pl);
      el.innerHTML = h; el.scrollTop = keep;
      var b;
      if ((b = $("#start"))) b.onclick = function () { setP({ r: 1 }); };
      if ((b = $("#reveal"))) b.onclick = function () { setP({ rv: s.R }); };
      if ((b = $("#next"))) b.onclick = function () { setP({ r: s.R + 1 }); };
      el.querySelectorAll("[data-vote]").forEach(function (btn) {
        btn.onclick = function () { setP({ vt: [s.R, btn.getAttribute("data-vote")] }); };
      });
      var d = $("#unread"); d.hidden = !unread; d.textContent = unread;
    }

    function renderChat() {
      var box = $("#msgs"), near = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
      var list = Array.from(chat.values()).sort(function (a, b) { return a.s - b.s; }).slice(-80);
      box.innerHTML = list.length ? list.map(function (m) {
        var t = m.s ? new Date(m.s).toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" }) : "";
        return '<div class="msg' + (m.me ? " me" : "") + '"><div class="meta">' + (m.me ? "أنا" : esc(m.n)) + " · " + esc(t) + '</div><div class="bub">' + esc(m.t) + "</div></div>";
      }).join("") : '<div class="empty">لسه مفيش رسايل. اكتب أول رسالة.</div>';
      if (near || list.length && list[list.length - 1].me) box.scrollTop = box.scrollHeight;
    }

    $("#form").addEventListener("submit", function (e) {
      e.preventDefault();
      var inp = $("#msg"), t = inp.value.trim().slice(0, 100);
      if (!t) return;
      var m = { i: uid + Date.now().toString(36), n: name, t: t, s: Date.now() };
      myChat = myChat.concat([m]).slice(-5);
      chat.set(m.i, { i: m.i, n: name, t: t, s: m.s, u: uid, me: true });
      setP({ c: myChat });
      inp.value = ""; renderChat();
    });

    function setTab(t) {
      tab = t;
      $("#pgame").classList.toggle("off", t !== "game");
      $("#pchat").classList.toggle("off", t !== "chat");
      $("#tgame").setAttribute("aria-selected", String(t === "game"));
      $("#tchat").setAttribute("aria-selected", String(t === "chat"));
      if (t === "chat") { unread = 0; var box = $("#msgs"); box.scrollTop = box.scrollHeight; }
      queue();
    }
    $("#tgame").onclick = function () { setTab("game"); };
    $("#tchat").onclick = function () { setTab("chat"); };

    renderChat(); render();
  }
})();
</script>

</body>
</html>
